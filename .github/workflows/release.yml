name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "LICENSE", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Version à publier ?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $tag existe déjà, rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dix Doigts ${{ needs.check.outputs.tag }}
          body: |
            ## Téléchargement

            | Système | Fichier |
            | --- | --- |
            | Windows | `DixDoigts-*-windows-setup.exe` (installateur) ou `-windows-portable.exe` (sans installation) |
            | macOS (Intel et Apple Silicon) | `DixDoigts-*-mac-universal.dmg` |
            | Linux | `DixDoigts-*-linux-x86_64.AppImage` ou `DixDoigts-*-linux-amd64.deb` |

            L'app n'est pas signée. Sur Windows, clique sur « Informations complémentaires » puis « Exécuter quand même ».
            Sur macOS, fais clic droit sur l'app puis « Ouvrir » la première fois.
          files: dist/*
